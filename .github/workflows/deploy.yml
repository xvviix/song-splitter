name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild self-contained installers
        run: python3 build-installers.py

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp splitter.worker.js _site/
          cp sw.js _site/
          cp manifest.webmanifest _site/
          cp og.svg _site/
          cp robots.txt _site/
          cp sitemap.xml _site/
          cp 404.html _site/
          mkdir -p _site/engine
          cp engine/*.py engine/*.bat engine/*.sh _site/engine/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
